name: Windows RDP for Android Studio

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PASS: Dev@12345!   # Change this to something you remember!

    steps:
      - name: Enable RDP fully
        run: |
          # Set registry to allow RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Type DWord
          # Enable firewall rule
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Ensure service is running (sometimes needed)
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Set strong password for default admin user
        run: |
          net user runneradmin "${{ env.RDP_PASS }}" 

      - name: Download and configure ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Invoke-WebRequest -Uri https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

      - name: Start ngrok TCP tunnel in background
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok.err"

      - name: Wait and extract/display ngrok TCP address
        run: |
          $maxWait = 120  # seconds
          $slept = 0
          while ($slept -lt $maxWait) {
            try {
              $json = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -Method Get -ErrorAction Stop
              $tcpTunnel = $json.tunnels | Where-Object { $_.proto -eq "tcp" }
              if ($tcpTunnel) {
                $addr = $tcpTunnel.public_url -replace 'tcp://', ''
                Write-Host "====================================="
                Write-Host "RDP READY! Connect now:"
                Write-Host "Server: $addr"
                Write-Host "Username: runneradmin"
                Write-Host "Password: ${{ env.RDP_PASS }}"
                Write-Host "(Use Microsoft Remote Desktop app or any RDP client)"
                Write-Host "====================================="
                break
              }
            } catch {
              Write-Host "Tunnel not ready yet... waiting ($slept s)"
            }
            Start-Sleep -Seconds 10
            $slept += 10
          }
          if ($slept -ge $maxWait) { Write-Error "Ngrok tunnel failed to appear after ${maxWait}s - check ngrok.err log" }

      - name: Optional - Install Android Studio (takes time, comment out if testing)
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          choco feature enable -n allowGlobalConfirmation
          choco install androidstudio -y --ignore-checksums

      - name: Keep job alive
        run: |
          Write-Host "RDP session active - use the info above to connect."
          while ($true) { Start-Sleep -Seconds 300; Write-Host "Still alive... $(Get-Date)" }
