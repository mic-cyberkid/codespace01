name: Windows RustDesk Remote Access (via Tor)

on:
  workflow_dispatch:

jobs:
  rustdesk-access:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RUSTDESK_PASSWORD: YourStrongPass123! # Change this

    steps:
      - name: Install Dependencies (Tor & RustDesk)
        shell: pwsh
        run: |
          choco install tor rustdesk.install -y --force

      - name: Start Tor
        shell: pwsh
        run: |
          Start-Process "C:\ProgramData\chocolatey\bin\tor.exe" -WindowStyle Hidden

          Write-Host "Waiting for Tor..."
          Start-Sleep 15

          Test-NetConnection 127.0.0.1 -Port 9050

      - name: Configure RustDesk
        shell: pwsh
        run: |
          cd "C:\Program Files\RustDesk"

          # Set permanent password
          .\rustdesk.exe --password "$env:RUSTDESK_PASSWORD"

          # Install/start service
          .\rustdesk.exe --install-service

          Start-Sleep 5

          Start-Service RustDesk -ErrorAction SilentlyContinue

      - name: Get Connection Info
        shell: pwsh
        run: |
          cd "C:\Program Files\RustDesk"
      
          $idFile = "$env:TEMP\rustdesk-id.txt"
      
          # Remove old file if it exists
          if (Test-Path $idFile) {
              Remove-Item $idFile -Force
          }
      
          # Write RustDesk ID to file
          .\rustdesk.exe --get-id *> $idFile
      
          Start-Sleep -Seconds 3
      
          if (Test-Path $idFile) {
              $id = (Get-Content $idFile -Raw).Trim()
          } else {
              $id = ""
          }
      
          Write-Host "===== RustDesk Connection ====="
          Write-Host "ID: $id"
          Write-Host "Password: $env:RUSTDESK_PASSWORD"
          Write-Host "==============================="
      
          @"
          ## RustDesk Connection
      
          **RustDesk ID:** $id
      
          **Password:** $env:RUSTDESK_PASSWORD
          "@ >> $env:GITHUB_STEP_SUMMARY
    

      - name: Display Connection Info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "====================================="
          Write-Host "RustDesk is ready!"
          Write-Host ""
          Write-Host "Tor SOCKS5 : 127.0.0.1:9050"
          Write-Host "RustDesk ID: $env:RUSTDESK_ID"
          Write-Host "Password   : $env:RUSTDESK_PASSWORD"
          Write-Host "====================================="

          @"
          ## RustDesk Connection

          **RustDesk ID:** $env:RUSTDESK_ID

          **Password:** $env:RUSTDESK_PASSWORD

          **Tor SOCKS5:** 127.0.0.1:9050
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "Runner will remain online..."

          while ($true) {
              Start-Sleep 300
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Session active"
          }
