name: Windows RustDesk Remote Access (via Tor)

on:
  workflow_dispatch:

jobs:
  rustdesk-access:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      RUSTDESK_PASSWORD: YourStrongPass123!   # ← Change this!

    steps:
      - name: Install Tor and RustDesk
        shell: pwsh
        run: |
          choco install tor rustdesk.install -y --force

      - name: Start Tor Proxy
        shell: pwsh
        run: |
          Write-Host "Starting Tor..."
          Start-Process "C:\ProgramData\chocolatey\bin\tor.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 20

          if (Test-NetConnection 127.0.0.1 -Port 9050 -InformationLevel Quiet) {
              Write-Host "Tor SOCKS5 is running."
          } else {
              throw "Tor failed to start."
          }

      - name: Configure & Start RustDesk Service
        shell: pwsh
        run: |
          $rustdesk = "C:\Program Files\RustDesk\RustDesk.exe"
          
          Write-Host "Setting password..."
          & $rustdesk --password "$env:RUSTDESK_PASSWORD"
          
          Write-Host "Installing service..."
          & $rustdesk --install-service
          
          Start-Sleep -Seconds 8
          
          Write-Host "Starting service..."
          Start-Service RustDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 12

          Write-Host "Launching tray (background)..."
          Start-Process $rustdesk -ArgumentList "--tray" -WindowStyle Hidden

      - name: Collect Diagnostics (Improved)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Header($t) { 
              Write-Host "`n======================================================"
              Write-Host $t
              Write-Host "======================================================" 
          }

          Header "RustDesk ID & Status"
          $id = & "C:\Program Files\RustDesk\RustDesk.exe" --get-id | Out-String
          Write-Host "ID: $id"
          
  

          
      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "RustDesk should now be accessible via Tor SOCKS5."
          Write-Host "ID and connection info should appear in previous step logs."
          while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner still alive. Check previous step for ID."
          }
