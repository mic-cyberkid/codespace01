name: Windows RDP Android Studio

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: developer
      RDP_PASS: Dev@12345!Strong

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP user (PASSWORD FIX)
      run: |
        net user $env:RDP_USER $env:RDP_PASS /add
        net localgroup administrators $env:RDP_USER /add

    - name: Download & Configure ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip
        .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start ngrok tunnel
      run: |
        Start-Process -NoNewWindow -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 10
        Invoke-RestMethod http://127.0.0.1:4040/api/tunnels

    - name: Install Android Studio
      run: |
        choco install androidstudio -y

    - name: Keep alive
      run: |
        Write-Host "RDP is running..."
        Start-Sleep -Seconds 21600
