name: Windows RustDesk Remote Access (via Tor)
on: [workflow_dispatch]

jobs:
  rustdesk-access:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RUSTDESK_PASSWORD: YourStrongPass123! # CHANGE THIS
    steps:
      - name: Install Dependencies (Tor & RustDesk)
        run: |
          choco install tor rustdesk.install -y --force
          
      - name: Start Tor Service
        run: |
          # Start Tor in the background
          Start-Process -FilePath "C:\ProgramData\chocolatey\bin\tor.exe" -WindowStyle Hidden
          Write-Host "Waiting for Tor to initialize..."
          Start-Sleep -Seconds 15
          # Verify Tor is listening on 9050
          Test-NetConnection -ComputerName 127.0.0.1 -Port 9050

      - name: Configure RustDesk Proxy & Set Password
        run: |
          cd "C:\Program Files\RustDesk"
          
          # Set the password
          .\rustdesk.exe --password "$env:RUSTDESK_PASSWORD"
          
          # Configure SOCKS5 Proxy (Tor default is 127.0.0.1:9050)
          # Note: RustDesk CLI configuration options can vary by version.
          # If --proxy isn't supported via CLI, RustDesk uses the system proxy or internal config.
          #.\rustdesk.exe --set-proxy "127.0.0.1:9050"
          
          .\rustdesk.exe --install-service
          Start-Sleep -Seconds 5
          Start-Service -Name RustDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 15 

      - name: Get Connection Info
        run: |
          cd "C:\Program Files\RustDesk"
          $idRaw = & .\rustdesk.exe --get-id | Out-String
          $id = $idRaw.Trim()
          
          Write-Host "====================================="
          Write-Host "Tor Proxy: Running on 127.0.0.1:9050"
          Write-Host "RustDesk ID: $id"
          Write-Host "Password: $env:RUSTDESK_PASSWORD"
          Write-Host "====================================="
          
          # Keep alive loop
          while ($true) { 
            Start-Sleep -Seconds 300
            Write-Host "Session active: $(Get-Date)" 
          }
