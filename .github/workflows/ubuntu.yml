name: Ubuntu RustDesk Remote Access

on: [workflow_dispatch]

jobs:
  rustdesk-access:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      RUSTDESK_PASSWORD: YourStrongPass123!   # CHANGE THIS

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libfuse2 xvfb

      - name: Download RustDesk AppImage
        run: |
          wget -O rustdesk.AppImage https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-1.4.5-x86_64.AppImage
          chmod +x rustdesk.AppImage

      - name: Set RustDesk password
        run: |
          ./rustdesk.AppImage --password "$RUSTDESK_PASSWORD"

      - name: Start RustDesk (headless)
        run: |
          # Run inside virtual X server to avoid black screen issues
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99

          nohup ./rustdesk.AppImage > rustdesk.log 2>&1 &
          sleep 10

          ps aux | grep rustdesk | grep -v grep || true

      - name: Get RustDesk ID
        run: |
          export DISPLAY=:99
          ID=$(./rustdesk.AppImage --get-id | tr -d '\n')
          echo "====================================="
          echo "RustDesk READY!"
          echo "ID: $ID"
          echo "Password: $RUSTDESK_PASSWORD"
          echo "Download client: https://rustdesk.com/"
          echo "====================================="

      - name: Keep session alive
        run: |
          while true; do
            echo "Session alive: $(date)"
            sleep 300
          done
