name: Ubuntu RustDesk Remote Access

on: [workflow_dispatch]

jobs:
  rustdesk-access:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTDESK_PASSWORD: YourStrongPass123!   # CHANGE THIS
    steps:
      - name: Update system & install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget curl xvfb dbus-x11

      - name: Download & install RustDesk
        run: |
          wget https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-1.4.5-x86_64.deb
          sudo dpkg -i rustdesk-1.4.5-x86_64.deb || sudo apt -f install -y

      - name: Set RustDesk password
        run: |
          rustdesk --password "$RUSTDESK_PASSWORD"
          sleep 3

      - name: Install & start RustDesk systemd service
        run: |
          sudo rustdesk --install-service
          sudo systemctl daemon-reexec
          sudo systemctl enable rustdesk
          sudo systemctl start rustdesk
          sleep 10
          systemctl status rustdesk --no-pager

      - name: Get RustDesk ID reliably
        run: |
          rustdesk --get-id | tee rustdesk_id.txt
          ID=$(cat rustdesk_id.txt | tr -d '\n')
          echo "====================================="
          echo "RustDesk READY!"
          echo "ID: $ID"
          echo "Password: $RUSTDESK_PASSWORD"
          echo "====================================="

      - name: Keep runner alive
        run: |
          echo "Session alive. Waiting for connections..."
          while true; do
            echo "Still alive at $(date)"
            sleep 300
          done
